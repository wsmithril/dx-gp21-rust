[package]
name = "dx-gp21-nrf52840"
version.workspace = true
edition.workspace = true
description = "nRF52840 board support for the DX-GP21 GNSS module — Embassy UART, power control, 1PPS edge wait"
license = "MIT"

# ── Build ──────────────────────────────────────────────────────────────────────
# Cross-compile with:
#   rustup target add thumbv7em-none-eabi
#   cargo build -p dx-gp21-nrf52840 --target thumbv7em-none-eabi
#
# This crate is excluded from `cargo build --workspace`; add it to your own
# embedded project's Cargo.toml as a path dependency.

[dependencies]
dx-gp21-core     = { workspace = true, features = ["async"] }
dx-gp21-embedded = { path = "../dx-gp21-embedded", features = ["async"] }

embassy-nrf      = { version = "0.11", features = ["nrf52840", "gpiote"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m"] }
critical-section = "1"

[features]
default = []
defmt = ["dep:defmt"]

[dependencies.defmt]
workspace = true
optional = true

[dev-dependencies]
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-nrf      = { version = "0.11", features = ["nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-time     = "0.5"
static_cell      = "2"
defmt            = { workspace = true }
defmt-rtt        = "1"
cortex-m-rt      = "0.7"
panic-probe      = { version = "1", features = ["print-defmt"] }
