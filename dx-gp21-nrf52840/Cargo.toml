[package]
name = "dx-gp21-nrf52840"
version.workspace = true
edition.workspace = true
description = "nRF52840 board support for the DX-GP21 GNSS module — UART, power control, 1PPS interrupt and wake"
license = "MIT"

# ── Build ──────────────────────────────────────────────────────────────────────
# Cross-compile with:
#   rustup target add thumbv7em-none-eabihf
#   cargo build -p dx-gp21-nrf52840 --target thumbv7em-none-eabihf
#
# This crate is excluded from `cargo build --workspace`; add it to your own
# embedded project's Cargo.toml as a path dependency.

[dependencies]
dx-gp21-embedded = { path = "../dx-gp21-embedded", features = ["async", "defmt"] }
dx-gp21-core     = { path = "../dx-gp21-core",     features = ["async", "defmt"] }

nrf52840-hal     = "0.16"
embedded-hal     = "0.2"
cortex-m         = "0.7"
critical-section = "1"

[features]
default = []
defmt = ["dep:defmt"]

[dependencies.defmt]
version  = "0.3"
optional = true

[dev-dependencies]
embassy-executor = { version = "0.6", features = ["arch-cortex-m", "executor-thread"] }
embassy-nrf      = { version = "0.2", features = ["nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-time     = "0.3"
static_cell      = "2"
defmt            = "0.3"
defmt-rtt        = "0.4"
cortex-m-rt      = "0.7"
panic-probe      = { version = "0.3", features = ["print-defmt"] }
